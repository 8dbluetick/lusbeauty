<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <!-- Sleek Midnight Plum Background -->
  <rect width="320" height="100" rx="8" fill="#1C1017"/>
  
  <!-- Eyebrow Gold Text -->
  <text x="160" y="24" font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="800" letter-spacing="3" fill="#D4AF37" text-anchor="middle">PROFESSIONAL COSMETICS</text>

  <!-- Main Wordmark 3Q BEAUTY -->
  <text x="160" y="62" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" letter-spacing="2.5" fill="#FFFFFF" text-anchor="middle">
    <tspan fill="#E65178">3Q</tspan> BEAUTY
  </text>
  
  <!-- Rose Gold Accent Divider -->
  <line x1="85" y1="72" x2="235" y2="72" stroke="#E65178" stroke-width="2"/>
  
  <!-- Tagline -->
  <text x="160" y="86" font-family="'Montserrat', 'Arial', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.5" fill="#F8BBD0" text-anchor="middle">NEW YORK · DUBAI · PARIS</text>
</svg>