<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70" fill="none">
  <!-- Minimalist Black Salon Frame Background -->
  <rect width="260" height="70" rx="8" fill="#0A0A0A"/>
  
  <!-- Red Japanese Seal / Accent Dot -->
  <rect x="22" y="24" width="8" height="22" rx="1.5" fill="#E50914"/>
  
  <!-- Syoss Lowercase Modern Wordmark -->
  <text x="38" y="42" font-family="'Helvetica Neue', 'Arial Black', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">syoss</text>
  
  <!-- Divider Line -->
  <line x1="126" y1="23" x2="126" y2="48" stroke="#333333" stroke-width="1.5"/>
  
  <!-- Heritage & Professional Tagline -->
  <text x="134" y="32" font-family="'Montserrat', 'Arial', sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.8" fill="#E5E5E5">EST. OSAKA, JAPAN 1977</text>
  <text x="134" y="44" font-family="'Montserrat', 'Arial', sans-serif" font-size="7" font-weight="700" letter-spacing="1.2" fill="#A0A0A0">PROFESSIONAL PERFORMANCE</text>
</svg>