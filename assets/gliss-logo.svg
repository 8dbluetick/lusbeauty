<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <!-- Clean Sleek Background -->
  <rect width="320" height="100" rx="8" fill="#141414"/>
  
  <!-- Schwarzkopf Sub-brand -->
  <text x="160" y="26" font-family="'Montserrat', 'Arial', sans-serif" font-size="11" font-weight="800" letter-spacing="3.5" fill="#D4AF37" text-anchor="middle">SCHWARZKOPF</text>
  
  <!-- Main GLISS Wordmark -->
  <text x="160" y="65" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">GLISS</text>
  
  <!-- Gold Accent Divider -->
  <line x1="80" y1="74" x2="240" y2="74" stroke="#E5A93C" stroke-width="2"/>
  
  <!-- Tagline Hair Repair Liquid Keratin -->
  <text x="160" y="88" font-family="'Montserrat', 'Arial', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2" fill="#E5A93C" text-anchor="middle">HAIR REPAIR · LIQUID KERATIN</text>
</svg>